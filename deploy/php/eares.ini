; PHP settings for the wordpress container (mounted into conf.d).
; Large enough for a full issue of the Rizareitis as a PDF and for photos
; straight off a phone; Caddy's request_body limit in deploy/Caddyfile must
; stay at least as large as post_max_size.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Don't advertise the PHP version in an X-Powered-By header.
expose_php = Off
